# Render blueprint for the AgeLens public demo (docs/DEPLOY.md). Free plan, no persistent disk:
# the database is rebuilt from the seeded simulated dataset at every start; requests and sessions are lost on restart.
# As written it starts an OPEN demo (no invite code; reviewer and study desks closed). Optional, added later in the
# Render dashboard (Environment), never committed: AGELENS_INVITES (turns the invite gate on; scripts/invite.py env),
# AGELENS_REVIEWER_TOKEN / AGELENS_STUDY_TOKEN (open those desks to people who know the token).
services:
  - type: web
    name: agelens-demo
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --public
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
