# Render blueprint for the AgeLens public demo (docs/DEPLOY.md). Free plan, no persistent disk:
# the database is rebuilt from the seeded simulated dataset at every start; requests and sessions are lost on restart.
services:
  - type: web
    name: agelens-demo
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --public
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # secrets: entered in the Render dashboard, never committed (sync: false = Render asks for the value)
      - key: AGELENS_INVITES
        sync: false
      - key: AGELENS_REVIEWER_TOKEN
        sync: false
      - key: AGELENS_STUDY_TOKEN
        sync: false
