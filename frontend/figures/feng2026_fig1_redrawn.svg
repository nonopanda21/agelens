<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" role="img" aria-labelledby="ft fd" class="lit-svg">
<title id="ft">Posted upper age limits and job-application outcomes (Feng et al. 2026, Figure 1, redrawn)</title>
<desc id="fd">Three pairs of bars. Just above a posted upper age limit, applications per posting are about 17 percent lower (index 100 to 83), positive responses per posting about 19 percent lower (100 to 81), and the positive-response rate per application about 14 percent lower (100 to 86). Bars are computed from the estimates printed in the paper's Figure 1.</desc>
<style>.lit-svg text{font-family:Nunito,system-ui,"Segoe UI","Noto Sans",Arial,sans-serif;fill:#4A3728}.lit-svg .s{fill:#6E5D4C;font-size:11.5px}.lit-svg .t{font-family:"Patrick Hand",Nunito,cursive;font-size:16px;font-weight:400}.lit-svg .v{font-size:15px;font-weight:800}.lit-svg .lo{fill:#A8D8EA;stroke:#4A3728;stroke-width:2}.lit-svg .hi{fill:#FFB6C1;stroke:#4A3728;stroke-width:2}.lit-svg .ax{stroke:#4A3728;stroke-width:2;stroke-dasharray:6 5}</style>
<g>
<text class="t" x="15" y="26">(a) Applications</text><text class="s" x="15" y="43">per job posting</text>
<line class="ax" x1="15" y1="215" x2="225" y2="215"/>
<rect class="lo" x="33" y="75" width="70" height="140" rx="3"/>
<rect class="hi" x="137" y="98.8" width="70" height="116.2" rx="3"/>
<text class="v" x="68" y="68" text-anchor="middle">100</text>
<text class="v" x="172" y="91.8" text-anchor="middle">83</text>
<text class="s" x="68" y="232" text-anchor="middle">just below</text><text class="s" x="172" y="232" text-anchor="middle">just above</text>
<text class="s" x="15" y="259">θ = -0.161 (SE 0.043)</text><text class="s" x="15" y="274">pre-limit mean = 0.949</text>
</g>
<g>
<text class="t" x="251" y="26">(b) Positive responses</text><text class="s" x="251" y="43">per job posting</text>
<line class="ax" x1="251" y1="215" x2="461" y2="215"/>
<rect class="lo" x="269" y="75" width="70" height="140" rx="3"/>
<rect class="hi" x="373" y="101.9" width="70" height="113.1" rx="3"/>
<text class="v" x="304" y="68" text-anchor="middle">100</text>
<text class="v" x="408" y="94.9" text-anchor="middle">81</text>
<text class="s" x="304" y="232" text-anchor="middle">just below</text><text class="s" x="408" y="232" text-anchor="middle">just above</text>
<text class="s" x="251" y="259">θ = -0.062 (SE 0.025)</text><text class="s" x="251" y="274">pre-limit mean = 0.323</text>
</g>
<g>
<text class="t" x="487" y="26">(c) Positive-response rate</text><text class="s" x="487" y="43">per application</text>
<line class="ax" x1="487" y1="215" x2="697" y2="215"/>
<rect class="lo" x="505" y="75" width="70" height="140" rx="3"/>
<rect class="hi" x="609" y="94.2" width="70" height="120.8" rx="3"/>
<text class="v" x="540" y="68" text-anchor="middle">100</text>
<text class="v" x="644" y="87.2" text-anchor="middle">86</text>
<text class="s" x="540" y="232" text-anchor="middle">just below</text><text class="s" x="644" y="232" text-anchor="middle">just above</text>
<text class="s" x="487" y="259">θ = -0.050 (SE 0.021)</text><text class="s" x="487" y="274">pre-limit mean = 0.365</text>
</g>
<text class="s" x="15" y="302">Index: mean just below limit = 100; “just above” = (mean + θ) ÷ mean × 100, computed from the printed values.</text>
</svg>